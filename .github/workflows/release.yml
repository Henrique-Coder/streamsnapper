name: Auto Release Creation and PyPI Publishing

on:
  push:
    branches:
      - prod

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release-and-publish:
    name: 🏷️ Create Release and Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🔍 Check Commit Message
        id: check_commit
        env:
          COMMIT_MSG: "${{ github.event.head_commit.message }}"
        run: |
          if [[ "$COMMIT_MSG" == chore:*"bump version to"* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: ⚡ Setup UV
        if: steps.check_commit.outputs.should_release == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 📝 Set Package Info
        if: steps.check_commit.outputs.should_release == 'true'
        id: release_config
        run: |
          echo "pkg_name=streamsnapper" >> $GITHUB_OUTPUT
          echo "pkg_title=StreamSnapper" >> $GITHUB_OUTPUT
          echo "pkg_desc=Extract and analyze YouTube video streams with intelligent quality selection, language fallback, and comprehensive metadata retrieval" >> $GITHUB_OUTPUT

      - name: 📝 Extract Version and Text
        if: steps.check_commit.outputs.should_release == 'true'
        id: version_info
        env:
          COMMIT_MSG: "${{ github.event.head_commit.message }}"
        run: |
          VERSION=$(echo "$COMMIT_MSG" | grep -oP 'chore: bump version to \K[^ )]+')
          EXTRA_TEXT=$(echo "$COMMIT_MSG" | grep -oP '\(.*\)' | sed 's/[()]//g' || echo "")

          echo "Version detected: $VERSION"
          echo "Extra text: $EXTRA_TEXT"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "extra_text=$EXTRA_TEXT" >> $GITHUB_OUTPUT

      - name: 🏷️ Get Previous Tag
        if: steps.check_commit.outputs.should_release == 'true'
        id: previoustag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Previous tag: $PREV_TAG"
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: 📝 Generate Commit List
        if: steps.check_commit.outputs.should_release == 'true'
        id: commit_list
        run: |
          COMMITS=$(git log --pretty=format:"- [%s](https://github.com/${{ github.repository }}/commit/%H)" ${{ steps.previoustag.outputs.tag }}..HEAD | grep -v "^- \[chore: bump version to" || echo "- No significant changes in this release")
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🏗️ Build Package
        if: steps.check_commit.outputs.should_release == 'true'
        run: uv build

      - name: ✅ Validate Package
        if: steps.check_commit.outputs.should_release == 'true'
        run: uvx twine check dist/*

      - name: 🌍 Set Timezone
        if: steps.check_commit.outputs.should_release == 'true'
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "UTC"

      - name: 🚀 Create Release
        if: steps.check_commit.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_info.outputs.version }}
          name: ${{ steps.version_info.outputs.extra_text != '' && format('🎉 {0} {1} - {2}', steps.release_config.outputs.pkg_title, steps.version_info.outputs.version, steps.version_info.outputs.extra_text) || format('🎉 {0} {1}', steps.release_config.outputs.pkg_title, steps.version_info.outputs.version) }}
          body: |
            ## 📦 Summary

            > _${{ steps.release_config.outputs.pkg_desc }}_

            ❇️ Available for automatic installation at [PyPI](https://pypi.org/project/${{ steps.release_config.outputs.pkg_name }}) and manual installation at [GitHub](https://github.com/${{ github.repository }}).

            ### 📋 Changelog:

            ${{ steps.commit_list.outputs.commits }}

            ### 📊 Compare Changes

            [View all changes](https://github.com/${{ github.repository }}/compare/${{ steps.previoustag.outputs.tag }}...v${{ steps.version_info.outputs.version }})
          draft: false
          prerelease: false
          files: |
            dist/*.whl
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Upload to PyPI
        if: steps.check_commit.outputs.should_release == 'true'
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
